<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS: als eigenständige App ohne Safari-Leisten starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudoku">
  <meta name="theme-color" content="#121829">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <title>Sudoku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <!-- Hauptmenü -->
  <section id="menu" class="screen active">
    <div class="menu-head">
      <div class="logo glass">
        <span>5</span><span></span><span>3</span>
        <span></span><span>9</span><span></span>
        <span>1</span><span></span><span>7</span>
      </div>
      <h1>Sudoku</h1>
    </div>

    <!-- Start-Ansicht -->
    <div class="menu-main">
      <button id="startBtn" class="glass btn pill start">Neues Spiel</button>
      <button id="resumeBtn" class="glass btn pill resume hidden">
        <span class="resume-title">Fortsetzen</span>
        <span id="resumeInfo" class="resume-info"></span>
      </button>
    </div>

    <!-- Schwierigkeit wählen -->
    <div class="menu-levels">
      <p class="sub">Wähle deinen Schwierigkeitsgrad</p>
      <div id="levels" class="levels"></div>
      <button id="levelsBack" class="btn pill ghost-pill">Zurück</button>
    </div>
  </section>

  <!-- Spiel -->
  <section id="game" class="screen">
    <header class="topbar">
      <button id="backBtn" class="glass icon-btn" aria-label="Zurück">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div id="levelName" class="level-name"></div>
      <div></div>
    </header>

    <div class="stats">
      <div class="stat left"><span class="label">Punkte</span><span id="score" class="value">0</span></div>
      <div id="timer" class="glass timer">00:00</div>
      <div class="stat right"><span class="label err">Fehler</span><span id="mistakes" class="value">0</span></div>
    </div>

    <div id="board" class="board glass"></div>

    <div class="tools">
      <button id="undoBtn" class="tool">
        <span class="glass icon-btn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></span>
        <span class="tool-label">Zurück</span>
      </button>
      <button id="eraseBtn" class="tool">
        <span class="glass icon-btn"><svg viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg></span>
        <span class="tool-label">Löschen</span>
      </button>
      <button id="hintBtn" class="tool">
        <span class="glass icon-btn"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0012 2z"/></svg>
          <span id="hintBadge" class="badge hidden">0</span></span>
        <span class="tool-label">Tipp</span>
      </button>
      <button id="notesBtn" class="tool">
        <span class="glass icon-btn"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          <span class="badge state">AUS</span></span>
        <span class="tool-label">Notizen</span>
      </button>
    </div>

    <div id="numpad" class="numpad"></div>
  </section>

  <!-- Dialoge -->
  <div id="modal" class="modal hidden"><div id="sheet" class="sheet glass"></div></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><p>Sudoku wird erstellt …</p></div>
  <div id="toast" class="toast glass"></div>

  <script src="sudoku.js"></script>
  <script src="bg.js"></script>
  <script src="app.js"></script>
</body>
</html>

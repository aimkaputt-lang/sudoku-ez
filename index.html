<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS: als eigenständige App ohne Safari-Leisten starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sudokez">
  <meta name="theme-color" content="#f5f3ee">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <title>Sudokez</title>
  <script>
    // Echte App-Höhe: iOS meldet als Home-Bildschirm-App manchmal eine zu kleine Höhe.
    // Dann nehmen wir die volle Bildschirmhöhe, damit unten nichts abgeschnitten wird.
    (function () {
      function setH() {
        var standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
        var h = window.innerHeight;
        if (standalone && screen.height > h && Math.abs(screen.width - window.innerWidth) < 2) h = screen.height;
        document.documentElement.style.setProperty('--app-h', h + 'px');
        window.__appH = h;
      }
      setH();
      addEventListener('resize', setH);
      addEventListener('orientationchange', function () { setTimeout(setH, 300); });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@300;400;500;700;800&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <!-- Hauptmenü -->
  <section id="menu" class="screen active">
    <!-- Oben rechts: Einstellungen -->
    <div class="menu-top">
      <span></span>
      <button id="settingsBtn" class="paper icon-btn" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>
      </button>
    </div>
    <div class="menu-head">
      <div class="logo paper">
        <span>3</span><span></span><span></span>
        <span></span><span>6</span><span></span>
        <span></span><span></span><span>1</span>
      </div>
      <h1>Sudokez</h1>
      <!-- Streak + heutige Sudokus als dunkle Papier-Schablone -->
      <div id="streak" class="paper streak">
        <svg viewBox="0 0 24 24"><path d="M12 21c-3.9 0-6.5-2.6-6.5-6.2 0-3.3 2.3-5.2 3.6-7.8.4 1.8 1.2 3 2.4 3.6-.2-3 1.2-5.6 3.6-7.1-.3 2.8.9 4.6 2.2 6.4 1.1 1.5 1.7 3 1.7 4.9 0 3.6-3 6.2-7 6.2z"/></svg>
        <b id="streakNum">0</b>
        <span id="streakLabel">Tage in Folge</span>
        <i class="streak-sep"></i>
        <svg class="grid-ico" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M9.3 4v16M14.7 4v16M4 9.3h16M4 14.7h16"/></svg>
        <b id="todayNum">0</b>
        <span id="todayLabel">heute</span>
      </div>
    </div>

    <!-- Unten: Fortsetzen, darüber aufklappende Schwierigkeiten, darunter Neues Spiel / Abbrechen -->
    <div class="menu-bottom sheet-dark torn">
      <button id="resumeBtn" class="paper btn pill resume hidden">
        <span class="resume-title">Fortsetzen</span>
        <span id="resumeInfo" class="resume-info"></span>
      </button>
      <div class="drop">
        <div class="drop-inner">
          <p class="sub">Schwierigkeit wählen</p>
          <div id="levels" class="levels"></div>
        </div>
      </div>
      <button id="startBtn" class="paper btn pill start">Neues Spiel</button>
    </div>
  </section>

  <!-- Statistik -->
  <section id="stats" class="screen">
    <h2 class="page-title">Statistik</h2>
    <div id="statChips" class="chips"></div>
    <div id="statSlides" class="slides"></div>
    <div class="foot sheet-dark torn"></div>
  </section>

  <!-- Leiste unten: Spielen / Statistik -->
  <nav id="tabbar" class="tabbar paper">
    <span class="tab-indicator"></span>
    <button class="tab active" data-tab="menu">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M9.2 3.5v17M14.8 3.5v17M3.5 9.2h17M3.5 14.8h17"/></svg>
      <span>Spielen</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>
      <span>Statistik</span>
    </button>
  </nav>

  <!-- Spiel -->
  <section id="game" class="screen">
    <header class="topbar">
      <button id="backBtn" class="paper icon-btn" aria-label="Zurück">
        <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div id="levelName" class="level-name"></div>
      <div></div>
    </header>

    <div class="stats">
      <div class="stat left"><span class="label">Punkte</span><span id="score" class="value">0</span></div>
      <div id="timer" class="paper timer">00:00</div>
      <div class="stat right"><span class="label err">Fehler</span><span id="mistakes" class="value">0</span></div>
    </div>

    <div class="board-wrap paper"><div id="board" class="board"></div></div>

    <div class="game-foot sheet-dark torn">
    <div class="tools">
      <button id="undoBtn" class="tool">
        <span class="paper icon-btn"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 010 11H11"/></svg></span>
        <span class="tool-label">Zurück</span>
      </button>
      <button id="eraseBtn" class="tool">
        <span class="paper icon-btn"><svg viewBox="0 0 24 24"><path d="M14.6 3.6a2 2 0 012.8 0l3 3a2 2 0 010 2.8L11 18.8H7.2l-3.6-3.6a2 2 0 010-2.8z"/><path d="M9 9l6 6"/><path d="M11 18.8h9"/></svg></span>
        <span class="tool-label">Löschen</span>
      </button>
      <button id="hintBtn" class="tool">
        <span class="paper icon-btn"><svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 00-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0012 2z"/></svg>
          <span id="hintBadge" class="badge hidden">0</span></span>
        <span class="tool-label">Tipp</span>
      </button>
      <button id="notesBtn" class="tool">
        <span class="paper icon-btn"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>
          <span class="badge state">AUS</span></span>
        <span class="tool-label">Notizen</span>
      </button>
    </div>

    <div id="numpad" class="numpad"></div>
    </div>
  </section>

  <!-- Dialoge -->
  <div id="modal" class="modal hidden"><div id="sheet" class="sheet paper"></div></div>
  <div id="loading" class="loading hidden"><div class="spinner"></div><p>Sudokez wird erstellt …</p></div>
  <div id="toast" class="toast paper"></div>

  <script src="sudoku.js"></script>
  <script src="bg.js"></script>
  <script src="paper.js"></script>
  <script src="app.js"></script>
</body>
</html>

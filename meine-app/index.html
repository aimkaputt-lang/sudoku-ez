<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover: Inhalt geht bis unter Notch / Home-Indicator -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">

  <!-- iOS: als eigenständige App ohne Safari-Leisten starten -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Meine App">
  <meta name="theme-color" content="#111827">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">

  <title>Meine App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Meine App</h1>
  </header>

  <main class="content">
    <p id="mode"></p>
    <button id="btn">Tippen</button>
    <p id="count">0</p>
  </main>

  <nav class="tabbar">
    <button class="active">Start</button>
    <button>Suche</button>
    <button>Profil</button>
  </nav>

  <script src="app.js"></script>
</body>
</html>
